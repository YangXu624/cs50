<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body style="margin: 0px">
        <div id="container1">
            <a href="image.html" class="button">Image Search</a>
            <a href="index.html" class="button">Google Search</a>
        </div>
        <div id="container2">
            <form action="https://www.google.com/search">
                <div class="searchbar2">
                    <input class="rounded_bar" type="text" name="as_q" placeholder="all these words">
                    <input class="rounded_bar" type="text" name="as_epq" placeholder="this exact word or phrase">
                    <input class="rounded_bar" type="text" name="as_oq" placeholder="any of these words">
                    <input class="rounded_bar" type="text" name="as_eq" placeholder="none of these words">
                    <input class="rounded_button" type="submit" value="Advanced Search">
                </div>
            </form>
        </div>
    </body>
</html>
