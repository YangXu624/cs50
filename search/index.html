<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>
        <link rel="stylesheet" href="styles.css">

        <div id="container1">
            <a href="image.html" class="button">Image Search</a>
            <a href="advanced.html" class="button">Advanced Search</a>

        <div id="container2">
