<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion Example</title>
    <style>
        h1 {
            text-align: center;
            margin-top: 20px;
        }
        /* Accordion Styles */
        .accordion {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .accordion-item {
            border-bottom: 1px solid #ddd;
        }

        .accordion-header {
            background-color: #f7f7f7;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .accordion-button {
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            padding: 10px;
            font-size: 16px;
        }

        .accordion-button:focus {
            outline: none;
        }

        .accordion-collapse {
            display: none;
            padding: 10px;
            background-color: #fff;
        }

        .accordion-collapse.open {
            display: block;
        }
    </style>
</head>
<body>

    <h1>Accordion Example</h1>

    <div class="accordion">
        <div class="accordion-item">
            <div class="accordion-header">
                <button class="accordion-button" type="button">
                    Accordion Item #1
                </button>
            </div>
            <div class="accordion-collapse open">
                <div class="accordion-body">
                    This is the content of the first accordion item. It is expanded by default.
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <div class="accordion-header">
                <button class="accordion-button" type="button">
                    Accordion Item #2
                </button>
            </div>
            <div class="accordion-collapse">
                <div class="accordion-body">
                    This is the content of the second accordion item. It is collapsed by default.
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <a href="index.html">Back to homepage</a>
    </div>

    <script>
        // JavaScript to handle accordion toggle
        document.querySelectorAll('.accordion-button').forEach(button => {
            button.addEventListener('click', () => {
                const accordionCollapse = button.parentElement.nextElementSibling;

                accordionCollapse.classList.toggle('open');
            });
        });
    </script>

</body>
</html>
