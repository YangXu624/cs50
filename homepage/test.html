<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion Example</title>
    <link rel="stylesheet" href="https://path-to-your-css/accordion-styles.css"> <!-- Optional: Link to your CSS -->
</head>
<body>

    <div class="accordion">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button" type="button" data-toggle="collapse" data-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                    Accordion Item #1
                </button>
            </h2>
            <div id="collapseOne" class="accordion-collapse collapse open" data-parent="#accordionExample">
                <div class="accordion-body">
                    This is the content of the first accordion item. It is expanded by default.
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-toggle="collapse" data-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                    Accordion Item #2
                </button>
            </h2>
            <div id="collapseTwo" class="accordion-collapse collapse" data-parent="#accordionExample">
                <div class="accordion-body">
                    This is the content of the second accordion item. It is collapsed by default.
                </div>
            </div>
        </div>
    </div>

    <script src="https://path-to-your-js/accordion-scripts.js"></script> <!-- Optional: Link to your JS -->
</body>
</html>
