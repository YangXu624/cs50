{% extends "layout.html" %}

{% block title %}
    History
{% endblock %}

{% block main %}
    <div style="text-align: center;">
        <div class="mb-3">
            <table style="margin: 20px auto; border-collapse: collapse; display: inline-block;">
                <thead>
                    <tr>
                        <th style="border: 1px solid black; padding: 8px;">Stock</th>
                        <th style="border: 1px solid black; padding: 8px;">Quantity</th>
                        <th style="border: 1px solid black; padding: 8px;">Transaction Type</th>
                        <th style="border: 1px solid black; padding: 8px;">Time</th>
                    </tr>
                </thead>
                <tbody>
                    {% for items in info %}
                    <tr>
                        <td style="border: 1px solid black; padding: 8px;">{{ info['symbol'] }}</td>
                        <td style="border: 1px solid black; padding: 8px;">{{ info['quantity'] }}</td>
                        <td style="border: 1px solid black; padding: 8px;">{{ info['transaction_type'] }}</td>
                        <td style="border: 1px solid black; padding: 8px;">{{ info['time'] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
