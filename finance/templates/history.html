{% extends "layout.html" %}

{% block title %}
    History
{% endblock %}

{% block main %}
    <div style="text-align: center;">
        <div class="mb-3">
            <table style="margin: 0 auto; border-collapse: collapse; display: inline-block;">
                <thead>
                    <tr>
                        <th style="border: 1px solid black; padding: 8px;">Username</th>
                        <th style="border: 1px solid black; padding: 8px;">Balance</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="border: 1px solid black; padding: 8px;">{{ userinfo['username'] }}</td>
                        <td style="border: 1px solid black; padding: 8px;">{{ userinfo['cash'] }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="mb-3">
            <table style="margin: 20px auto; border-collapse: collapse; display: inline-block;">
                <thead>
                    <tr>
                        <th style="border: 1px solid black; padding: 8px;">Symbol</th>
                        <th style="border: 1px solid black; padding: 8px;">Quantity</th>
                        <th style="border: 1px solid black; padding: 8px;">Total Value</th>
                    </tr>
                </thead>
                <tbody>
                    {% for stock in stocks %}
                    <tr>
                        <td style="border: 1px solid black; padding: 8px;">{{ stock['symbol'] }}</td>
                        <td style="border: 1px solid black; padding: 8px;">{{ stock['amount'] }}</td>
                        <td style="border: 1px solid black; padding: 8px;">{{ stock['value'] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
