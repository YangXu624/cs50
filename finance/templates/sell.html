{% extends "layout.html" %}

{% block title %}
    Sell
{% endblock %}

{% block main %}
    <div action="/sell" method="post">
        <div class="mb-3">
            <select name="Symbol">
                <option disabled selected value="">Symbol</option>
                <option>Yes</option>
                <option>No</option>
        </div>
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="quantity" placeholder="Shares" type="number">
        </div>
        <button class="btn btn-primary" type="submit">Sell</button>
    </div>
{% endblock %}
