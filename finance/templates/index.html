{% extends "layout.html" %}

{% block title %}
    Homepage
{% endblock %}

{% block main %}
    <div action="/">
        <div class="mb-3">
            <p>Username: {{ userinfo }}</p>
            <p>Balance: {{ userinfo['cash'] }}</p>

            {% for stock in stocks %}

            <p>{{ stock['symbol'] }} {{ stock['amount'] }}</p>

            {% endfor %}
        </div>
    </div>
{% endblock %}
