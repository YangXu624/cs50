{% extends "layout.html" %}

{% block title %}
    Homepage
{% endblock %}

{% block main %}
    <div action="/">
        <div class="mb-3">
            <table>
                <tr>
                    <th>Username</th>
                    <th>Balance</th>
                </tr>
                <tr>
                    <td>{{ userinfo['username'] }}</td>
                    <td>{{ userinfo['cash'] }}</td>
                </tr>
            </table>
            <table>
                {% for stock in stocks %}

                <p>{{ stock['symbol'] }} {{ stock['amount'] }}</p>

                {% endfor %}
            </table>
        </div>
    </div>
{% endblock %}
