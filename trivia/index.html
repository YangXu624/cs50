<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // TODO: Add code to check answers to questions
            function check_answer() {
                // Get the input field element
                const answerField = document.querySelector('#ans');

                // Get the value of the input field
                const answer = answerField.value.trim();

                let messageContainer = document.querySelector('#message-container1');

                // If no message container exists, create one
                if (!messageContainer) {
                    messageContainer = document.createElement('p');
                    messageContainer.id = 'message-container1'; // Assign an ID for future reference
                    document.querySelector('form').appendChild(messageContainer); // Append it to the form
                }

                // Check if the answer is correct
                if (answer.toLowerCase() === 'k2') {
                    // Change the background color of the input field to green
                    answerField.style.backgroundColor = 'lightgreen';
                    // Update the message container
                    messageContainer.textContent = 'Correct!';
                    messageContainer.style.color = 'green';
                } else {
                    // Change the background color of the input field to coral
                    answerField.style.backgroundColor = 'lightcoral';
                    // Update the message container
                    messageContainer.textContent = 'Incorrect!';
                    messageContainer.style.color = 'red';
                }
            }

            function check_mcq(button) {
                let messageContainer = document.querySelector('#message-container2');

                // If no message container exists, create one
                if (!messageContainer) {
                    messageContainer = document.createElement('p');
                    messageContainer.id = 'message-container2'; // Assign an ID for future reference
                    document.querySelector('.section').appendChild(messageContainer); // Append it to the section
                }

                if (button.value === "Tanzania") {
                    button.style.backgroundColor = 'lightgreen'
                    messageContainer.textContent = 'Correct!';
                    messageContainer.style.color = 'green';
                } else {
                    button.style.backgroundColor = 'lightcoral'
                    messageContainer.textContent = 'Incorrect!';
                    messageContainer.style.color = 'red';
                }
            }
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->
                <h3>In which country is Mount Kilimanjaro?</h3>
                <button value="Tanzania" onclick="check_mcq(this)">Tanzania</button>
                <button value="Niger" onclick="check_mcq(this)">Niger</button>
                <button value="Indonesia" onclick="check_mcq(this)">Indonesia</button>
                <button value="USA" onclick="check_mcq(this)">USA</button>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                <h3>What is the second tallest mountain in the world?</h3>
                <form onsubmit="check_answer(); return false;">
                    <input autocomplete="off" autofocus id="ans" placeholder="Answer" type="text">
                    <input type="submit">
                </form>
            </div>
        </div>
    </body>
</html>
