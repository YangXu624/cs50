<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // TODO: Add code to check answers to questions
            function check_answer() {
                // Get the input field element
                const answerField = document.querySelector('#ans');

                // Get the value of the input field
                const answer = answerField.value.trim();

                // Check if the answer is correct
                if (answer.toLowerCase() === 'k2') {
                    alert('Correct!');
                    // Change the background color of the input field to green
                    answerField.style.backgroundColor = 'lightgreen';
                } else {
                    alert('Incorrect!');
                    // Optionally, you can reset the background color if the answer is incorrect
                    answerField.style.backgroundColor = 'lightcoral';
                }
            }

            function check_mcq(button) {
                if (button.value === "Tanzania") {
                    button.style.backgroundColor = 'lightgreen'
                } else {
                    button.style.backgroundColor = 'lightcoral'
                }
            }
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->
                <h3>In which country is Mount Kilimanjaro?</h3>
                <button onclick="check_mcq(this)">Tanzania</button>
                <button onclick="check_mcq(this)">Niger</button>
                <button onclick="check_mcq(this)">Indonesia</button>
                <button onclick="check_mcq(this)">USA</button>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                <h3>What is the second tallest mountain in the world?</h3>
                <form onsubmit="check_answer(); return false;">
                    <input autocomplete="off" autofocus id="ans" placeholder="Answer" type="text">
                    <input type="submit">
                </form>
            </div>
        </div>
    </body>
</html>
